<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcador de vida Pokémon TCG</title>
<style>
:root{--bg:#edf1f7;--surface:#fff;--ink:#14213d;--mute:#5d6b86;--line:#d5dcea;--accent:#2f4fd8;--on-accent:#fff;--good:#1f9d63;--warn:#e0a100;--bad:#d1372d;--track:#e1e7f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--surface:#16203a;--ink:#eaf0ff;--mute:#9aa8c7;--line:#2a3757;--accent:#ffd23f;--on-accent:#1a1500;--good:#3ed08f;--warn:#ffc933;--bad:#ff6f64;--track:#232f4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--surface:#16203a;--ink:#eaf0ff;--mute:#9aa8c7;--line:#2a3757;--accent:#ffd23f;--on-accent:#1a1500;--good:#3ed08f;--warn:#ffc933;--bad:#ff6f64;--track:#232f4d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:32px;line-height:1.05;letter-spacing:-.03em;margin:14px 0 6px}
.sub{color:var(--mute);margin:0 0 22px}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.mode b{display:block;font-size:17px}
.mode small{color:var(--mute)}
.mode .ic{flex:none;font-size:26px;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--track)}
.mode[disabled]{opacity:.6;cursor:default}
.tag{font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:2px 9px;margin-left:8px}
.top{display:flex;justify-content:space-between;margin-bottom:12px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.bad{color:var(--bad)}
.btn.wide{width:100%;margin-top:8px}
.btn[disabled]{opacity:.5;cursor:default}
.field{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:14px;margin-bottom:12px}
.field h2{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;margin:0 0 6px}
.field h2 small{font-size:13px;font-weight:500;color:var(--mute)}
.cap{font-size:13px;color:var(--mute);margin:8px 0 4px}
.bench{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bench>*{min-width:0}
.tile{width:100%;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:84px;padding:8px 7px;border:1.5px dashed var(--line);border-radius:12px;background:transparent}
.tile span{display:block}
.tile.full{border-style:solid;background:var(--bg)}
.tile.act{min-height:112px;padding:13px;border-radius:18px}
.nm{font-weight:800;font-size:13px;line-height:1.15;overflow-wrap:anywhere}
.act .nm{font-size:20px}
.hp{font-size:12px;color:var(--mute);margin-top:2px}
.act .hp{font-size:15px}
.st{font-size:14px}
.plus{margin:auto;font-size:24px;color:var(--mute)}
.bar{height:6px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:9px}
.bar.big{height:12px;margin:6px 0 4px}
.tile.ko{border-color:var(--bad)}
.ko .nm{text-decoration:line-through;opacity:.75}
.sheet{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,24,.55)}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:520px;max-height:90%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.row input{flex:1;margin:0}
.big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mute{color:var(--mute);font-size:14px}
.life{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.life b{font-size:64px;line-height:.95;letter-spacing:-.04em}
.life span{color:var(--mute);font-size:18px}
.life em{margin-left:auto;font-style:normal;font-weight:800;color:var(--bad)}
.lbl{font-weight:800;margin:16px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:10px 15px;font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}
.err{color:var(--bad);min-height:1.3em;margin:4px 0 0;font-size:14px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.res button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:6px;text-align:center;font-size:12px;font-weight:700}
.res img{width:100%;aspect-ratio:63/88;object-fit:contain;display:block;margin-bottom:4px}
.res small{display:block;color:var(--mute);font-weight:500}
.thumb{width:62px;flex:none;border-radius:6px}
.tile.im{background-repeat:no-repeat;background-position:right 10px center;background-size:auto 86%;padding-right:84px}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;max-width:300px;margin:10px auto 0}
.cam video{width:100%;display:block}
.cam i{position:absolute;top:6%;height:88%;left:50%;aspect-ratio:63/88;transform:translateX(-50%);border:3px solid rgba(255,255,255,.7);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.4)}
.note{color:var(--mute);font-size:13px;margin:8px 0 2px}
#dbg canvas{display:block;max-width:100%;height:auto;margin:6px 0;border:1px solid var(--line);border-radius:6px}
</style>
</head>
<body>
<main id="app"></main>
<div id="sheet" class="sheet" hidden></div>
<script>
const K='marcador-tcg-v1',$=s=>document.querySelector(s);
const ST={poison:['☠️','Veneno'],burn:['🔥','Queimadura'],sleep:['💤','Dormindo'],para:['⚡','Paralisado'],conf:['💫','Confuso']};
const EX=['sleep','para','conf'];
let S=null,view='home',ui=null,armed=false,armT;
try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(!S||!S.p)S=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const rem=c=>Math.max(0,c.hp-c.dmg);
const slot=(p,s)=>S.p[p].slots[s];
const tone=p=>p>50?'var(--good)':p>25?'var(--warn)':'var(--bad)';
const bar=(c,cls='')=>{const p=Math.round(rem(c)/c.hp*100);return `<span class="bar ${cls}"><i style="width:${p}%;background:${tone(p)}"></i></span>`};

function tile(p,s){
  const c=slot(p,s),a=s===0?' act':'',at=`data-a="open" data-p="${p}" data-s="${s}"`;
  if(!c)return `<button class="tile${a}" ${at} aria-label="Adicionar Pokémon"><span class="plus">+</span></button>`;
  const r=rem(c);
  return `<button class="tile full${a}${c.img&&s===0?' im':''}${r?'':' ko'}"${c.img&&s===0?` style="background-image:url('${c.img}/low.webp')"`:''} ${at}><span class="nm">${esc(c.name)}</span><span><span class="st">${c.st.map(k=>ST[k][0]).join(' ')}</span><span class="hp">${r?r+' de '+c.hp:'Nocauteado'}</span>${bar(c)}</span></button>`;
}
function field(p,label){
  const n=S.p[p].slots.filter(Boolean).length;
  return `<section class="field"><h2>${label}<small>${n} em jogo</small></h2><div class="cap">Ativo</div>${tile(p,0)}<div class="cap">Banco</div><div class="bench">${[1,2,3,4,5].map(s=>tile(p,s)).join('')}</div></section>`;
}
function home(){
  return `<h1>Marcador de vida</h1><p class="sub">Dano, condições e vida restante dos Pokémon na mesa.</p>
  ${S?`<button class="mode" data-a="cont"><span class="ic">▶️</span><span><b>Continuar partida</b><small>Voltar de onde parou</small></span></button>`:''}
  <button class="mode" data-a="new" data-m="solo"><span class="ic">🎯</span><span><b>Solo</b><small>Só o seu campo</small></span></button>
  <button class="mode" data-a="new" data-m="duo"><span class="ic">🤝</span><span><b>2 jogadores, 1 celular</b><small>Seu campo e o do adversário</small></span></button>
  <button class="mode" disabled><span class="ic">📡</span><span><b>Sala local<span class="tag">em breve</span></b><small>Cada um no seu celular. Você vê o campo do outro, mas só edita o seu.</small></span></button>`;
}
function game(){
  const duo=S.mode==='duo';
  return `<div class="top"><button class="btn" data-a="home">‹ Início</button><button class="btn bad" data-a="reset">${armed?'Toque para confirmar':'Limpar campo'}</button></div>`+(duo?field(1,'Jogador 2')+field(0,'Jogador 1'):field(0,'Seu campo'));
}
function addPanel(){
  return `<div class="row"><div class="big">${ui.s?'Novo no banco':'Novo Pokémon ativo'}</div><button class="btn" data-a="close">Fechar</button></div>
  <input id="nm" placeholder="Digite o nome para buscar a carta" autocomplete="off" maxlength="30">
  <div id="res"></div>
  <button class="btn wide" data-a="scan">Escanear carta</button>
  <div id="cam"></div>
  <p class="note">Sem resultado? Informe a vida à mão:</p>
  <input id="hv" type="number" inputmode="numeric" placeholder="Vida (PS) da carta">
  <div class="chips">${[60,90,120,150,180,230,300].map(v=>`<button class="chip" data-a="hp" data-v="${v}">${v}</button>`).join('')}</div>
  <p id="err" class="err"></p>
  <button class="btn pri wide" data-a="add">Colocar na mesa</button>`;
}
function cardPanel(c){
  const r=rem(c);
  return `<div class="row"><div><div class="big">${esc(c.name)}</div><div class="mute">${ui.s?'No banco':'Ativo'}, vida máxima ${c.hp}</div></div>${c.img?`<img class="thumb" src="${c.img}/high.webp" alt="">`:''}<button class="btn" data-a="close">Fechar</button></div>
  <div class="life"><b style="${r?'':'color:var(--bad)'}">${r}</b><span>de ${c.hp} PS</span>${r?'':'<em>Nocauteado</em>'}</div>
  ${bar(c,'big')}
  <p class="lbl">Dano recebido (total ${c.dmg})</p>
  <div class="chips">${[10,20,30,50].map(v=>`<button class="chip" data-a="dmg" data-v="${v}">+${v}</button>`).join('')}<button class="chip" data-a="dmg" data-v="-10">−10</button></div>
  <div class="row"><input id="dv" type="number" inputmode="numeric" placeholder="Outro valor, ex.: 60"><button class="btn pri" data-a="apply">Aplicar</button></div>
  <p class="lbl">Condições especiais</p>
  <div class="chips">${Object.keys(ST).map(k=>`<button class="chip${c.st.includes(k)?' on':''}" data-a="st" data-k="${k}">${ST[k][0]} ${ST[k][1]}</button>`).join('')}</div>
  <div class="row">${ui.s?'<button class="btn" data-a="swap">Trocar com o ativo</button>':'<span></span>'}<button class="btn bad" data-a="del">Remover da mesa</button></div>`;
}
const API='https://api.tcgdex.net/v2/',LANGS=['pt','en'];
let tmr,stream,ocr,loop,busy=false,tries=0;
const setRes=h=>{const r=$('#res');if(r)r.innerHTML=h};
const note=t=>setRes(`<p class="note">${t}</p>`);
async function api(path){
  for(const l of LANGS){
    try{const r=await fetch(API+l+'/'+path);if(r.ok){const j=await r.json();if(!Array.isArray(j)||j.length)return j}}catch(e){}
  }
  return null;
}
async function search(name,num){
  name=name.trim();
  if(name.length<2){setRes('');return}
  note('Buscando…');
  let list=await api('cards?name='+encodeURIComponent(name));
  if(!list){note('Nada encontrado (ou sem conexão). Digite nome e vida à mão.');return}
  const hit=num?list.filter(c=>parseInt(c.localId,10)===num):[];
  if(hit.length===1){pick(hit[0].id);return}
  list=hit.concat(list.filter(c=>!hit.includes(c))).slice(0,12);
  setRes(`<div class="res">${list.map(c=>`<button data-a="pick" data-id="${c.id}">${c.image?`<img loading="lazy" src="${c.image}/low.webp" alt="">`:''}${esc(c.name)}<small>${c.id}</small></button>`).join('')}</div>`);
}
async function pick(id){
  note('Carregando carta…');
  const c=await api('cards/'+id);
  if(!c){note('Não consegui carregar a carta.');return}
  if(c.hp>0){S.p[ui.p].slots[ui.s]={name:c.name,hp:+c.hp,dmg:0,st:[],img:c.image||''};ui=null;save();render()}
  else{ui.img=c.image||'';$('#nm').value=c.name;$('#err').textContent='Esta carta não tem PS. Informe a vida para continuar.';setRes('')}
}
document.addEventListener('input',e=>{
  if(e.target.id!=='nm')return;
  clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>search(v),450);
});
const SKIP=/^(basico|básico|basic|fase|stage|pokemon|pokémon|evolui|evolves|from)$/i;
const words=t=>(t.match(/[A-Za-zÀ-ÿ]{3,}/g)||[]).filter(w=>!SKIP.test(w));
const parseNum=t=>{
  const m=t.match(/(\d{1,3})\s*[\/|]\s*(\d{2,3})/);
  if(m)return parseInt(m[1],10);
  const r=(t.match(/\d{7}/)||[])[0];
  return r&&r[3]==='1'?parseInt(r.slice(0,3),10):0;
};
const setSt=t=>{const e=$('#stt');if(e)e.textContent=t};
function crop(v,sx,sy,sw,sh,maxw){
  const k=document.createElement('canvas'),f=Math.min(3,maxw/sw);
  k.width=Math.round(sw*f);k.height=Math.round(sh*f);
  k.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,k.width,k.height);
  return k;
}
function prep(k,bin){
  const g=k.getContext('2d'),im=g.getImageData(0,0,k.width,k.height),d=im.data,n=k.width*k.height,gy=new Uint8Array(n),h=new Array(256).fill(0);
  for(let i=0;i<n;i++){const y=(d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114)|0;gy[i]=y;h[y]++}
  let lo=0,hi=255,a=0,t=128,wh=0;
  while(lo<254&&(a+=h[lo])<n*.02)lo++;
  a=0;while(hi>1&&(a+=h[hi])<n*.02)hi--;
  if(bin){
    let sum=0,sb=0,wb=0,mx=0;
    for(let i=0;i<256;i++)sum+=i*h[i];
    for(let i=0;i<256;i++){wb+=h[i];const wf=n-wb;if(!wb||!wf)continue;sb+=i*h[i];const m1=sb/wb,m2=(sum-sb)/wf,v=wb*wf*(m1-m2)*(m1-m2);if(v>mx){mx=v;t=i}}
    for(let i=0;i<n;i++)if(gy[i]>t)wh++;
  }
  const inv=bin&&wh<n/2;
  for(let i=0;i<n;i++){
    let y=bin?(gy[i]>t?255:0):Math.min(255,Math.max(0,(gy[i]-lo)*255/Math.max(1,hi-lo)));
    if(inv)y=255-y;
    d[i*4]=d[i*4+1]=d[i*4+2]=y;
  }
  g.putImageData(im,0,0);return k;
}
async function ocrRead(k,psm,wl){
  await ocr.setParameters({tessedit_pageseg_mode:psm,tessedit_char_whitelist:wl});
  return (await ocr.recognize(k)).data.text;
}
async function loadOcr(){
  if(ocr)return;
  if(!window.Tesseract)await new Promise((ok,no)=>{const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';t.onload=ok;t.onerror=no;document.head.appendChild(t)});
  ocr=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status)setSt('Preparando o leitor: '+m.status+' '+Math.round((m.progress||0)*100)+'%')}});
}
async function startCam(){
  stopCam();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})}
  catch(e){note('Não consegui abrir a câmera. Permita o acesso e abra a página por HTTPS.');return}
  $('#cam').innerHTML='<div class="cam"><video id="v" playsinline muted autoplay></video><i></i></div><p class="note" id="stt">Abrindo…</p><div id="dbg"></div><button class="btn wide" data-a="stopcam">Parar câmera</button>';
  const v=$('#v');v.srcObject=stream;
  try{await v.play()}catch(e){}
  try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  try{await loadOcr()}catch(e){setSt('Não consegui baixar o leitor de texto. Verifique a internet.');return}
  if(!stream)return;
  tries=0;busy=false;setSt('Encaixe a carta na moldura, de frente e sem reflexo. Lendo automaticamente…');
  loop=setInterval(attempt,900);
}
function stopCam(){
  clearInterval(loop);busy=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const b=$('#cam');if(b)b.innerHTML='';
}
async function attempt(){
  const v=$('#v');
  if(busy||!ocr||!v||!v.videoWidth)return;
  busy=true;tries++;
  try{
    const vh=v.videoHeight,h=vh*.88,w=h*63/88,x=(v.videoWidth-w)/2,y=vh*.06;
    const nameC=bin=>prep(crop(v,x+w*.1,y+h*.02,w*.62,h*.11,1200),bin);
    const numC=bin=>prep(crop(v,x,y+h*.9,w,h*.1,1400),bin);
    const nb=nameC(true),mb=numC(true);
    let ws=words(await ocrRead(nb,'11',''));
    if(!ws.length)ws=words(await ocrRead(nameC(false),'11',''));
    let num=parseNum(await ocrRead(mb,'11','0123456789/'));
    if(!num)num=parseNum(await ocrRead(numC(false),'11','0123456789/'));
    if(!stream)return;
    ws=[...new Set(ws)].sort((a,b)=>b.length-a.length).slice(0,3);
    const d=$('#dbg');if(d)d.replaceChildren(nb,mb);
    setSt('Tentativa '+tries+': nome “'+(ws.join(', ')||'não li')+'”, número '+(num||'não li'));
    for(const w1 of ws){
      const list=await api('cards?name='+encodeURIComponent(w1));
      if(!stream)return;
      if(!list)continue;
      const hit=num?list.filter(c=>parseInt(c.localId,10)===num):[];
      if(hit.length===1||(!num&&list.length===1)){pick((hit[0]||list[0]).id);return}
      if(hit.length>1){stopCam();$('#nm').value=w1;search(w1,num);return}
    }
    if(tries>=5&&ws.length){const w1=ws[0];stopCam();$('#nm').value=w1;search(w1,num)}
  }catch(e){setSt('Erro na leitura, tentando de novo…')}
  finally{busy=false}
}
function render(){
  if(!ui)stopCam();
  $('#app').innerHTML=view==='game'&&S?game():home();
  const el=$('#sheet'),c=ui&&slot(ui.p,ui.s);
  el.hidden=!ui;
  el.innerHTML=ui?`<div class="panel">${c?cardPanel(c):addPanel()}</div>`:'';
}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){ui=null;render();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset,c=ui&&slot(ui.p,ui.s);
  const done=()=>{save();render()};
  if(a==='new'){S={mode:d.m,p:[0,1].map(()=>({slots:Array(6).fill(null)}))};view='game';done()}
  else if(a==='cont'){view='game';render()}
  else if(a==='home'){view='home';ui=null;render()}
  else if(a==='reset'){
    if(!armed){armed=true;armT=setTimeout(()=>{armed=false;render()},3000);render()}
    else{clearTimeout(armT);armed=false;S.p.forEach(x=>x.slots.fill(null));done()}
  }
  else if(a==='open'){ui={p:+d.p,s:+d.s};render();setTimeout(()=>{const n=$('#nm');n&&n.focus()},60)}
  else if(a==='close'){ui=null;render()}
  else if(a==='hp'){$('#hv').value=d.v}
  else if(a==='pick'){pick(d.id)}
  else if(a==='scan'){startCam()}
  else if(a==='stopcam'){stopCam()}
  else if(a==='add'){
    const n=$('#nm').value.trim(),h=parseInt($('#hv').value,10);
    if(!n||!(h>0)){$('#err').textContent='Preencha o nome e a vida (PS) da carta.';return}
    S.p[ui.p].slots[ui.s]={name:n,hp:h,dmg:0,st:[],img:ui.img||''};ui=null;done();
  }
  else if(!c)return;
  else if(a==='dmg'||a==='apply'){
    const v=a==='dmg'?+d.v:parseInt($('#dv').value,10);
    if(!isFinite(v))return;
    c.dmg=Math.min(c.hp,Math.max(0,c.dmg+v));done();
  }
  else if(a==='st'){
    const k=d.k,i=c.st.indexOf(k);
    if(i>=0)c.st.splice(i,1);
    else{if(EX.includes(k))c.st=c.st.filter(x=>!EX.includes(x));c.st.push(k)}
    done();
  }
  else if(a==='swap'){
    const sl=S.p[ui.p].slots,t=sl[0];sl[0]=sl[ui.s];sl[ui.s]=t;
    sl.forEach(x=>{if(x)x.st=[]});ui=null;done();
  }
  else if(a==='del'){S.p[ui.p].slots[ui.s]=null;ui=null;done()}
});
render();
</script>
